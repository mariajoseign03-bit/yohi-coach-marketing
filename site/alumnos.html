<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mi espacio · Yohi Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<main class="wrap" id="app" aria-live="polite">
  <p class="muted">Cargando tu espacio…</p>
</main>
<script src="/metricas.js"></script>
<script src="/portal.js"></script>
<script src="/mocca.js"></script>
<script src="/informe.js"></script>
<script src="/training.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const r = await api('/api/me');
  if (r.status === 401) { location.replace('/'); return; }
  if (!r.ok) { app.replaceChildren(el('p', { class: 'err' }, r.data.error || 'No pudimos cargar tu espacio.')); return; }
  const { user, plan } = r.data;
  if (user.role === 'admin') { location.replace('/admin'); return; }

  initMocca(user.name.split(' ')[0]);
  const top = el('div', { class: 'top' },
    el('div', {},
      el('span', { class: 'brand' }, 'YOHI COACH · ZONA ALUMNOS'),
      el('p', { class: 'hello' }, 'Hola, ' + user.name.split(' ')[0])),
    el('button', { class: 'btn ghost small', type: 'button', onclick: logout }, 'Cerrar sesión'));

  const agendaBox = el('section', { class: 'card', id: 'agenda' });
  const trainingBox = el('section', { class: 'card', id: 'entrenamiento' });
  const medBox = el('section', { class: 'card', id: 'mediciones' });
  const homeBox = el('div', { class: 'panel' }, el('p', { class: 'muted' }, 'Cargando…'));
  const presencial = !!(plan && plan.modality === 'presencial');

  const METRICS = [['weight_kg', 'Peso', 'kg'], ['fat_pct', 'Grasa', '%'], ['muscle_kg', 'Músculo', 'kg']];
  let metric = 'weight_kg';
  async function renderMed() {
    const m = await api('/api/measurements');
    const head = el('h2', { style: 'margin-top:0' }, 'Mediciones');
    if (!m.ok) { medBox.replaceChildren(head, el('p', { class: 'err' }, 'No pudimos cargar tus mediciones.')); return; }
    if (!m.data.enabled) {
      medBox.replaceChildren(head,
        el('p', { class: 'muted' }, 'Aquí verás cómo evolucionan tu peso, tu porcentaje de grasa y tu masa muscular, medidos por Yohi con Body Pro Go. Son datos de salud: Yohi solo puede cargarlos si tú lo autorizas. Es opcional y puedes retirarlo cuando quieras.'),
        el('button', { class: 'btn small', type: 'button', onclick: async () => { await api('/api/health-consent', { enabled: true }); renderMed(); } }, 'Autorizo el registro de mis mediciones'));
      return;
    }
    const items = m.data.items;
    const foot = el('div', { style: 'margin-top:18px' },
      el('p', { class: 'muted', style: 'font-size:12.5px' }, 'La bioimpedancia da estimaciones y varía con la hidratación, la comida y la hora del día. Lo que importa es la tendencia en varios controles, no un solo número.'),
      el('button', { class: 'btn ghost small', type: 'button', onclick: async () => {
        if (!confirm('Si retiras tu autorización se borran todas tus mediciones y Yohi no podrá cargar nuevas. ¿Continuar?')) return;
        await api('/api/health-consent', { enabled: false }); renderMed();
      } }, 'Retirar mi autorización y borrar mis mediciones'));
    if (!items.length) { medBox.replaceChildren(head, el('p', { class: 'muted' }, 'Yohi aún no ha cargado tus mediciones. Aparecerán aquí después de tu primer control.'), foot); return; }
    const last = items.filter((i) => METRICS.some(([k]) => i[k] !== null)).pop() || items[items.length - 1];
    const tiles = METRICS.filter(([k]) => last[k] !== null).map(([k, label, unit]) => {
      const base = items.find((i) => i[k] !== null);
      const diff = Math.round((last[k] - base[k]) * 10) / 10;
      return el('button', { type: 'button', class: 'tile', 'aria-pressed': String(metric === k), onclick: () => { metric = k; renderMed(); } },
        el('span', { class: 'tl' }, label),
        el('span', { class: 'tv' }, last[k] + ' ' + unit),
        el('span', { class: 'td' }, items.length > 1 && base !== last ? (diff > 0 ? '+' : '') + diff + ' ' + unit + ' desde ' + fmtDate(base.measured_on) : 'Primer control'));
    });
    if (!last[metric]) metric = (METRICS.find(([k]) => items.some((i) => i[k] !== null)) || ['weight_kg'])[0];
    const mu = METRICS.find(([k]) => k === metric);
    const chart = lineChart(items, metric, mu[2]);
    const rows = [...items].reverse().map((i) => el('tr', {}, el('td', {}, fmtDate(i.measured_on)),
      ...METRICS.map(([k]) => el('td', {}, i[k] === null ? '–' : String(i[k]))),
      el('td', {}, i.has_pdf ? el('a', { href: '/api/measurements/pdf?id=' + i.id, target: '_blank', rel: 'noopener' }, 'Ver') : '–')));
    const withData = items.filter((i) => METRICS.some(([k]) => i[k] !== null) || (i.extra && typeof i.extra.score === 'number'));
    const cmp = withData.length >= 2 ? compareBlock(withData[withData.length - 2], withData[withData.length - 1]) : null;
    const lastX = withData[withData.length - 1];
    const ana = lastX ? analysisBlock(lastX, withData.length > 1 ? withData[withData.length - 2] : null) : null;
    const repBtn = withData.length ? el('button', { class: 'btn small', type: 'button', style: 'margin-top:14px', onclick: () => YohiReport.print({ name: user.name, cur: withData[withData.length - 1], prev: withData.length > 1 ? withData[withData.length - 2] : null }) }, 'Descargar mi informe (PDF)') : '';
    medBox.replaceChildren(head, el('div', { class: 'tiles' }, ...tiles), chart || '', cmp || '', repBtn,
      ana ? el('div', { style: 'margin-top:18px' }, el('h3', { class: 'cmp-title', style: 'font-size:24px' }, 'Tu último informe, explicado'), el('p', { class: 'muted', style: 'font-size:13px;margin:0' }, 'Control del ' + fmtDate(lastX.measured_on) + '. Cada dato con lo que significa en palabras simples.'), ana) : '',
      el('div', { style: 'overflow-x:auto;margin-top:12px' }, el('table', { class: 'mtab' },
        el('thead', {}, el('tr', {}, el('th', {}, 'Fecha'), ...METRICS.map(([, l, u]) => el('th', {}, l + ' (' + u + ')')), el('th', {}, 'Informe'))), el('tbody', {}, ...rows))), foot);
  }
  renderMed();
  trainingSection(trainingBox);

  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const dayLabel = (iso) => { const [y, m, d] = iso.split('-').map(Number); return DIAS[new Date(Date.UTC(y, m - 1, d, 12)).getUTCDay()] + ' ' + d + ' ' + MESES[m - 1]; };
  const STATUS = { requested: ['Por confirmar', 'wait'], confirmed: ['Confirmada', 'okb'] };

  function slotBtn(s, onclick) {
    const b = el('button', { class: 'slot', type: 'button', onclick }, s.time);
    b.disabled = !s.free;
    return b;
  }

  async function renderAgenda() {
    const a = await api('/api/agenda');
    if (!a.ok || !a.data.plan) { agendaBox.replaceChildren(el('h2', {}, 'Agenda'), el('p', { class: 'muted' }, 'Tu plan no tiene agenda de sesiones.')); return; }
    const msg = el('p', { class: 'err', role: 'alert' });
    const mine = a.data.mine.map((b) => el('div', { class: 'item' },
      el('div', {}, el('strong', {}, dayLabel(b.day) + ' · ' + b.time), ' ', el('span', { class: 'badge ' + STATUS[b.status][1] }, STATUS[b.status][0])),
      el('button', { class: 'btn ghost small', type: 'button', onclick: async () => {
        if (!confirm('¿Cancelar esta hora? Si faltan menos de 24 horas, la sesión se pierde.')) return;
        const r = await api('/api/bookings/cancel', { id: b.id });
        if (!r.ok) { msg.textContent = r.data.error || 'No se pudo cancelar.'; return; }
        await renderAgenda();
        const m2 = document.getElementById('agenda-msg');
        if (m2) { m2.className = 'ok'; m2.textContent = r.data.returned ? 'Hora cancelada. Tu sesión volvió al plan.' : 'Hora cancelada. Como faltaba menos de 24 horas, la sesión se pierde.'; }
      } }, 'Cancelar')));
    const days = a.data.days.map((d) => el('div', { class: 'day' }, el('h3', {}, dayLabel(d.day)),
      el('div', { class: 'slots' }, d.slots.map((s) => slotBtn(s, async (ev) => {
        if (!confirm('¿Pedir ' + dayLabel(d.day) + ' a las ' + s.time + '? Se descuenta 1 sesión y Yohi la confirma.')) return;
        ev.target.disabled = true;
        const r = await api('/api/bookings', { day: d.day, time: s.time });
        await renderAgenda();
        const m2 = document.getElementById('agenda-msg');
        if (m2) { m2.className = r.ok ? 'ok' : 'err'; m2.textContent = r.ok ? 'Hora pedida. Yohi la confirmará pronto.' : (r.data.error || 'No se pudo pedir la hora.'); }
      })))));
    const left = a.data.plan.left;
    agendaBox.replaceChildren(
      el('h2', { style: 'margin-top:0' }, 'Agenda'),
      el('p', {}, el('span', { class: 'chip gold' }, left + (left === 1 ? ' sesión disponible' : ' sesiones disponibles')),
        ' ', el('span', { class: 'muted', style: 'font-size:13px' }, 'de ' + a.data.plan.total)),
      el('p', { class: 'muted', style: 'font-size:13px' }, 'Pides una hora y Yohi la confirma. Puedes cancelar hasta 24 horas antes y la sesión vuelve a tu plan. Las sesiones sin usar se pierden al terminar el plan.'),
      el('p', { id: 'agenda-msg', role: 'status' }),
      mine.length ? el('div', { class: 'list' }, ...mine) : '',
      el('h2', {}, 'Horas disponibles'),
      days.length ? el('div', { class: 'days' }, ...days) : el('p', { class: 'muted' }, 'Yohi aún no abre horarios. Vuelve pronto.'),
      msg);
  }
  if (presencial) renderAgenda();

  if (!presencial) agendaBox.replaceChildren(el('h2', { style: 'margin-top:0' }, 'Agenda'),
    el('p', { class: 'muted' }, plan ? 'Tu plan es de asesoría online, así que no tiene sesiones presenciales para agendar.' : 'Cuando Yohi cargue tu plan, aquí podrás pedir tus horas.'));

  // ---- Progreso: evolución, PRs, notas de Yohi y mediciones ----
  const evoHolder = el('div'), prHolder = el('div'), notesHolder = el('div');
  const progBox = el('div', { class: 'panel' }, evoHolder, prHolder, notesHolder, medBox);
  async function renderProgress() {
    const [pg, nt] = await Promise.all([api('/api/progress'), api('/api/notes')]);
    const data = pg.ok ? pg.data.exercises : [];
    evoHolder.replaceChildren(evolutionCard(data));
    prHolder.replaceChildren(prCard(data));
    notesHolder.replaceChildren(coachNotesCard(nt.ok ? nt.data.notes : []));
  }
  renderProgress();

  // ---- Inicio ----
  const plain = (t) => (t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const WEEKDAYS = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
  const todayIso = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Santiago' }).format(new Date());
  const dayNameForStudent = (label, n) => {
    const t = plain(label), m = t.match(/\bdia\s*(\d+)/);
    if (m) return 'Día ' + m[1];
    return /\b(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/.test(t) ? 'Día ' + (n + 1) : label;
  };
  function todayGroup(rd) {
    if (!rd || !rd.routine || !rd.exercises.length) return null;
    const groups = [];
    for (const ex of rd.exercises) {
      const d = (ex.day || '').trim();
      let g = groups.find((x) => x.day === d);
      if (!g) { g = { day: d, items: [] }; groups.push(g); }
      g.items.push(ex);
    }
    const done = (ex) => rd.logs.filter((l) => l.exercise_id === ex.id && l.set_type === 'work').length >= ex.sets;
    const wd = WEEKDAYS[new Date(todayIso + 'T12:00:00Z').getUTCDay()];
    let n = 0;
    groups.forEach((g) => { g.label = g.day ? dayNameForStudent(g.day, n++) : 'Tu rutina'; g.done = g.items.filter(done).length; });
    let pick = groups.find((g) => plain(g.day).includes(wd)) || null;
    if (!pick && rd.routine.day_on === todayIso) pick = groups[0];
    if (!pick) pick = groups.find((g) => g.done < g.items.length) || groups[groups.length - 1];
    return pick;
  }
  async function renderHome() {
    const [rt, ag, nt] = await Promise.all([api('/api/routine'), presencial ? api('/api/agenda') : Promise.resolve(null), api('/api/notes')]);
    const kids = [];
    // Plan
    const left = plan ? daysLeft(plan.end_date) : 0;
    if (plan) {
      const used = ag && ag.ok && ag.data.plan ? ag.data.plan.used : null;
      kids.push(el('section', { class: 'card', style: 'display:grid;gap:10px' },
        el('div', { class: 'row', style: 'justify-content:space-between' },
          el('span', { class: 'chip' }, presencial ? 'Presencial 1:1' : 'Asesoría online'),
          el('span', { class: 'chip gold' }, left + (left === 1 ? ' día' : ' días'))),
        presencial
          ? el('h1', { style: 'margin:0' }, used === null ? plan.sessions_total + ' sesiones' : used + ' de ' + plan.sessions_total + ' sesiones')
          : el('h1', { style: 'margin:0' }, 'Asesoría online'),
        presencial && used !== null ? el('div', { class: 'bar', role: 'img', 'aria-label': used + ' de ' + plan.sessions_total + ' sesiones usadas' }, el('i', { style: 'width:' + Math.min(100, Math.round((used / plan.sessions_total) * 100)) + '%' })) : '',
        el('p', { class: 'muted', style: 'margin:0;font-size:13.5px' }, (presencial ? (SEDE_NOMBRE[plan.sede] || '') + ' · ' : '') + 'plan vigente hasta el ' + fmtDate(plan.end_date))));
    } else {
      kids.push(el('section', { class: 'card' }, el('h1', {}, 'Tu plan'), el('p', { class: 'muted', style: 'margin:0' }, 'Yohi aún no ha cargado tu plan.')));
    }
    // Hoy te toca
    const g = rt.ok ? todayGroup(rt.data) : null;
    const goTo = (hash, text, ghost) => el('a', { class: 'btn' + (ghost ? ' ghost' : ''), href: hash }, text);
    kids.push(el('section', { class: 'card', style: 'display:grid;gap:10px;border-color:rgba(255,109,180,.45)' },
      el('div', { class: 'row', style: 'justify-content:space-between' }, el('span', { class: 'kick' }, 'Hoy te toca'),
        g ? el('span', { class: 'chip' + (g.done === g.items.length ? '' : ' gold') }, g.done === g.items.length ? 'Completado' : g.done + '/' + g.items.length + ' ejercicios') : ''),
      g ? el('p', { class: 'big', style: 'margin:0' }, g.label + ' · ' + g.items.length + (g.items.length === 1 ? ' ejercicio' : ' ejercicios'))
        : el('p', { class: 'muted', style: 'margin:0' }, 'Yohi aún no ha cargado tu rutina. Aparecerá aquí cuando esté lista.'),
      g ? goTo('#rutina', 'Ir a mi rutina') : ''));
    // Próxima sesión
    if (presencial && ag && ag.ok && ag.data.plan) {
      const next = ag.data.mine[0];
      kids.push(el('section', { class: 'card', style: 'display:grid;gap:8px' },
        el('span', { class: 'kick' }, 'Próxima sesión'),
        next
          ? el('div', { class: 'row', style: 'justify-content:space-between' },
              el('p', { class: 'big', style: 'margin:0' }, dayLabel(next.day) + ' · ' + next.time),
              el('span', { class: 'badge ' + STATUS[next.status][1] }, STATUS[next.status][0]))
          : el('p', { class: 'muted', style: 'margin:0' }, ag.data.plan.left > 0 ? 'Aún no tienes una hora pedida. Te quedan ' + ag.data.plan.left + (ag.data.plan.left === 1 ? ' sesión.' : ' sesiones.') : 'Ya usaste todas las sesiones de tu plan.'),
        goTo('#agenda', next ? 'Ver mi agenda' : 'Pedir una hora', true)));
    }
    // Última nota o hito visible de Yohi
    const lastNote = nt.ok && nt.data.notes[0];
    if (lastNote) kids.push(el('section', { class: 'card', style: 'display:grid;gap:6px' },
      el('span', { class: 'kick' }, lastNote.kind === 'milestone' ? 'Hito' : 'Nota de Yohi'),
      el('strong', {}, lastNote.title), lastNote.body ? el('p', { style: 'margin:0;color:var(--accent-soft)' }, lastNote.body) : '',
      el('a', { href: '#progreso', style: 'font-size:13px;font-weight:700' }, 'Ver todas mis notas')));
    homeBox.replaceChildren(...kids);
  }

  // ---- Chat (por ahora: Mocca y WhatsApp) ----
  const chatBox = el('section', { class: 'card', style: 'display:grid;gap:12px' },
    el('h2', { style: 'margin:0' }, 'Chat'),
    el('p', { class: 'muted', style: 'margin:0' }, 'Muy pronto vas a poder escribirle a Yohi desde aquí y ver sus respuestas. Mientras tanto:'),
    el('div', { class: 'row' },
      el('button', { class: 'btn', type: 'button', onclick: () => { const f = document.querySelector('.mc-fab'); if (f) f.click(); } }, 'Preguntarle a Mocca'),
      el('a', { class: 'btn ghost', href: 'https://wa.me/' + WA_NUM, target: '_blank', rel: 'noopener' }, 'Escribir a Yohi por WhatsApp')),
    el('p', { class: 'muted', style: 'margin:0;font-size:12.5px' }, 'Mocca resuelve dudas del portal. Dolor, lesiones y alimentación las ve Yohi directamente.'));

  // ---- Pestañas ----
  const ICON = {
    inicio: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    rutina: '<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',
    progreso: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
    agenda: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  };
  const TABS = [['inicio', 'Inicio', homeBox], ['rutina', 'Rutina', trainingBox], ['progreso', 'Progreso', progBox], ['chat', 'Chat', chatBox], ['agenda', 'Agenda', agendaBox]];
  const panels = {};
  const main = el('div', {});
  for (const [id, , node] of TABS) { const w = el('div', { class: 'tabpanel', id: 'tab-' + id, hidden: '' }, node); panels[id] = w; main.append(w); }
  const links = {};
  const nav = el('nav', { class: 'tabbar', 'aria-label': 'Secciones' }, el('div', { class: 'tabbar-in' }, ...TABS.map(([id, label]) => {
    const a = el('a', { class: 'tab', href: '#' + id });
    a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[id] + '</svg>';
    a.append(label); links[id] = a; return a;
  })));
  let started = false;
  function showTab() {
    const id = panels[location.hash.slice(1)] ? location.hash.slice(1) : 'inicio';
    for (const k of Object.keys(panels)) { panels[k].hidden = k !== id; links[k].classList.toggle('on', k === id); if (k === id) links[k].setAttribute('aria-current', 'page'); else links[k].removeAttribute('aria-current'); }
    if (id === 'inicio' && started) renderHome();
    if (id === 'progreso' && started) renderProgress();
    started = true;
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', showTab);

  app.classList.add('has-tabs'); document.body.classList.add('tabs-on');
  app.replaceChildren(top, main,
    el('p', { class: 'muted', style: 'margin-top:24px;font-size:13px' },
      'Tus datos están protegidos. ', el('a', { href: '/privacidad' }, 'Política de privacidad'), ' · ', el('a', { href: '/terminos' }, 'Términos')));
  document.body.append(nav);
  renderHome();
  showTab();
})();
</script>
</body>
</html>
