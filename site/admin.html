<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de Yohi · Yohi Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<main class="wrap" id="app" aria-live="polite">
  <p class="muted">Cargando…</p>
</main>
<script src="/metricas.js"></script>
<script src="/portal.js"></script>
<script src="/informe.js"></script>
<script src="/bodypro.js"></script>
<script src="/rutina-lector.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const me = await api('/api/me');
  if (me.status === 401) { location.replace('/'); return; }
  if (!me.ok || me.data.user.role !== 'admin') { location.replace('/alumnos'); return; }

  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

  function select(name, opts, value) {
    const s = el('select', { name }, opts.map(([v, t]) => el('option', { value: v }, t)));
    if (value) s.value = value;
    return s;
  }

  function approveForm(u, reload) {
    const msg = el('p', { class: 'err', role: 'alert' });
    const modality = select('modality', [['presencial', 'Presencial 1:1'], ['online', 'Asesoría online']], 'presencial');
    const sede = select('sede', [['quilpue', 'Quilpué'], ['vina', 'Viña del Mar'], ['quillota', 'Quillota']], 'quilpue');
    const sessions = el('input', { name: 'sessions', type: 'number', min: '1', max: '40', value: '12', inputmode: 'numeric' });
    const months = select('months', [['1', '1 mes'], ['3', '3 meses']], '1');
    const start = el('input', { name: 'start', type: 'date', value: today });
    const wPres = el('div', { class: 'form' }, el('label', {}, 'Sede', sede), el('label', {}, 'Sesiones del plan', sessions));
    const wOn = el('div', { class: 'form', hidden: '' }, el('label', {}, 'Duración', months));
    modality.addEventListener('change', () => { const p = modality.value === 'presencial'; wPres.hidden = !p; wOn.hidden = p; });
    const go = el('button', { class: 'btn', type: 'submit' }, 'Aprobar y asignar plan');
    const form = el('form', { class: 'form', novalidate: '' },
      el('label', {}, 'Modalidad', modality), wPres, wOn, el('label', {}, 'Inicio del plan', start), msg, go);
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); msg.textContent = ''; go.disabled = true;
      const body = { userId: u.id, modality: modality.value, start: start.value };
      if (modality.value === 'presencial') { body.sede = sede.value; body.sessions = Number(sessions.value); }
      else body.months = Number(months.value);
      const r = await api('/api/admin/approve', body);
      go.disabled = false;
      if (!r.ok) { msg.textContent = r.data.error || 'No se pudo aprobar.'; return; }
      reload();
    });
    return form;
  }

  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const dayDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); };
  const dayLabel = (iso) => { const dt = dayDate(iso); return DIAS[dt.getUTCDay()] + ' ' + dt.getUTCDate() + ' ' + MESES[dt.getUTCMonth()]; };
  const addIso = (iso, n) => new Date(dayDate(iso).getTime() + n * 86400000).toISOString().slice(0, 10);
  let sedeSel = 'quilpue';

  const MES_FULL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const DIA_CORTO = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  const DIA_LARGO = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  const MODE_TAG = { am: 'Mañana', pm: 'Tarde', wk: '9–13' };
  const SLOT_TIMES = { am: ['08:30', '09:30'], pm: ['16:00', '17:00', '18:00', '19:00'], wk: ['09:00', '10:00', '11:00', '12:00'] };
  // Rango horario -> horas de 1 h (cada hora debe terminar antes o justo a la hora "hasta").
  const toMin = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3));
  const fromMin = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const rangeSlots = (from, to) => { const out = []; for (let m = toMin(from); m + 60 <= toMin(to); m += 60) out.push(fromMin(m)); return out; };
  const rangeOf = (slots) => (slots && slots.length ? [slots[0], fromMin(toMin(slots[slots.length - 1]) + 60)] : ['', '']);
  const rangeTag = (o) => { const [a, b] = rangeOf(o.slots); return a ? a.replace(/^0/, '') + '–' + b.replace(/^0/, '') : MODE_TAG[o.mode]; };
  const mondayOf = (iso) => addIso(iso, -((dayDate(iso).getUTCDay() + 6) % 7));
  let agState = null; // { month: 'AAAA-MM', week: lunes 'AAAA-MM-DD' | null } — se conserva al refrescar

  // Agenda de Yohi: calendario mensual; al tocar una semana se despliegan sus 7 días (disponibilidad + horas pedidas).
  function agendaSection(ag0) {
    let ag = ag0;
    if (!agState) agState = { month: ag.today.slice(0, 7), week: mondayOf(ag.today) };
    const msg = el('p', { class: 'err', role: 'alert' });
    const pendingBox = el('div');
    const calBox = el('div');

    async function refresh() {
      const r = await api('/api/admin/agenda');
      if (r.ok) { ag = r.data; paint(); } else msg.textContent = r.data.error || 'No se pudo actualizar la agenda.';
    }
    async function bookingAct(id, action, label) {
      if (action !== 'confirm' && !confirm('¿' + label + ' esta hora? La sesión vuelve al plan de la alumna.')) return;
      const r = await api('/api/admin/booking', { id, action });
      if (!r.ok) { msg.textContent = r.data.error || 'No se pudo.'; return; }
      msg.textContent = r.data.gcal === 'error' ? 'Listo, pero no se pudo actualizar Google Calendar. Usa «Sincronizar».' : '';
      refresh();
    }
    async function syncGcal(btn) {
      btn.disabled = true; msg.textContent = '';
      const r = await api('/api/admin/gcal-sync', {});
      btn.disabled = false;
      if (!r.ok) { msg.textContent = r.data.error || 'No se pudo sincronizar.'; return; }
      msg.textContent = r.data.errors ? 'Se sincronizaron ' + r.data.synced + ' y fallaron ' + r.data.errors + '. Revisa que el calendario esté compartido con la cuenta de servicio.' : 'Google Calendar al día (' + r.data.synced + ' horas nuevas).';
      refresh();
    }
    const bkBtn = (b, action, label, ghost) => el('button', { class: 'btn small' + (ghost ? ' ghost' : ''), type: 'button', onclick: () => bookingAct(b.id, action, label) }, label);
    async function setMode(iso, mode) {
      msg.textContent = '';
      const r = await api('/api/admin/open-day', { day: iso, mode, sede: sedeSel });
      if (!r.ok) { msg.textContent = r.data.error || 'No se pudo.'; return false; }
      return true;
    }

    // Cambia el rango horario de un día ya abierto (mantiene su modo y sede).
    async function applyRange(iso, o, from, to) {
      const slots = rangeSlots(from, to);
      if (!from || !to || !slots.length) { msg.textContent = 'Elige «Desde» y «Hasta» con al menos 1 hora de diferencia.'; return false; }
      const r = await api('/api/admin/open-day', { day: iso, mode: o.mode, sede: o.sede, slots });
      if (!r.ok) { msg.textContent = (SEDE_NOMBRE ? dayLabel(iso) + ': ' : '') + (r.data.error || 'No se pudo.'); return false; }
      return true;
    }
    function rangeEditor(iso, o) {
      const [a, b] = rangeOf(o.slots);
      const fromIn = el('input', { type: 'time', step: '1800', value: a, 'aria-label': 'Desde' });
      const toIn = el('input', { type: 'time', step: '1800', value: b, 'aria-label': 'Hasta' });
      const prev = el('span', { class: 'muted', style: 'font-size:12.5px' });
      const upd = () => { const sl = rangeSlots(fromIn.value, toIn.value); prev.textContent = sl.length ? 'Horas de 1 h: ' + sl.join(', ') : 'Rango muy corto'; };
      fromIn.addEventListener('input', upd); toIn.addEventListener('input', upd); upd();
      const go = el('button', { class: 'btn small', type: 'button' }, 'Aplicar');
      go.onclick = async () => { go.disabled = true; msg.textContent = ''; if (await applyRange(iso, o, fromIn.value, toIn.value)) refresh(); go.disabled = false; };
      const reset = el('button', { class: 'btn ghost small', type: 'button' }, 'Restablecer');
      reset.onclick = async () => { const r = await api('/api/admin/open-day', { day: iso, mode: o.mode, sede: o.sede }); if (r.ok) refresh(); else msg.textContent = r.data.error || 'No se pudo.'; };
      return el('details', { class: 'rng' }, el('summary', {}, '🕐 Cambiar horario'),
        el('div', { class: 'rng-body' },
          el('label', {}, 'Desde', fromIn), el('label', {}, 'Hasta', toIn),
          el('div', { class: 'rng-btns' }, go, o.custom ? reset : ''), prev));
    }

    function bookedRow(b) {
      const ok = b.status === 'confirmed';
      return el('div', { class: 'slot-row ' + (ok ? 'ok' : 'req') },
        el('div', { class: 'slot-top' }, el('span', { class: 'slot-t' }, b.time), el('span', { class: 'badge ' + (ok ? 'okb' : 'wait') }, ok ? 'Confirmada' : 'Por confirmar')),
        el('div', { class: 'slot-name' }, b.name),
        el('div', { class: 'slot-btns' }, ...(ok ? [bkBtn(b, 'cancel', 'Cancelar', true)] : [bkBtn(b, 'confirm', 'Confirmar'), bkBtn(b, 'reject', 'Rechazar', true)])),
        moveBox(b));
    }

    // Mover una reserva a otra hora libre (de cualquier día abierto).
    function moveBox(b) {
      const taken = new Set(ag.bookings.filter((x) => x.id !== b.id).map((x) => x.day + ' ' + x.time));
      const opts = ag.days.filter((d) => d.day >= ag.today && d.mode !== 'closed')
        .map((d) => ({ day: d.day, times: (d.slots || []).filter((t) => !taken.has(d.day + ' ' + t) && !(d.day === b.day && t === b.time)) }))
        .filter((d) => d.times.length);
      const det = el('details', { class: 'mv' }, el('summary', {}, '↔ Mover'));
      if (!opts.length) { det.append(el('p', { class: 'muted', style: 'font-size:12.5px;margin:6px 0' }, 'No hay otras horas libres. Abre más horarios en el calendario.')); return det; }
      const daySel = el('select', { 'aria-label': 'Día nuevo' }, opts.map((o) => el('option', { value: o.day }, dayLabel(o.day))));
      const timeSel = el('select', { 'aria-label': 'Hora nueva' });
      const fillTimes = () => timeSel.replaceChildren(...opts.find((o) => o.day === daySel.value).times.map((t) => el('option', { value: t }, t)));
      daySel.addEventListener('change', fillTimes); fillTimes();
      const go = el('button', { class: 'btn small', type: 'button' }, 'Mover');
      go.onclick = async () => {
        go.disabled = true; msg.textContent = '';
        const r = await api('/api/admin/booking', { id: b.id, action: 'move', day: daySel.value, time: timeSel.value });
        go.disabled = false;
        if (!r.ok) { msg.textContent = r.data.error || 'No se pudo mover.'; return; }
        msg.textContent = r.data.gcal === 'error' ? 'Movida, pero no se pudo actualizar Google Calendar. Usa «Sincronizar».' : '';
        agState.week = mondayOf(daySel.value); agState.month = daySel.value.slice(0, 7);
        refresh();
      };
      det.append(el('div', { class: 'mv-body' }, daySel, timeSel, go));
      return det;
    }

    function dayCard(iso, i, o, bs) {
      const past = iso < ag.today;
      const cur = o ? o.mode : 'closed';
      const modes = i >= 5 ? [['closed', 'Cerrado'], ['wk', '9–13']] : [['closed', 'Cerrado'], ['am', 'Mañana'], ['pm', 'Tarde']];
      const seg = el('div', { class: 'seg wk-seg' }, modes.map(([m, t]) => {
        const b = el('button', { type: 'button', 'aria-pressed': String(cur === m), onclick: async () => { if (cur === m) return; if (await setMode(iso, m)) refresh(); } }, t);
        if (past) b.disabled = true;
        return b;
      }));
      const times = [...new Set([...((o && o.slots && o.slots.length) ? o.slots : (SLOT_TIMES[cur] || [])), ...bs.map((b) => b.time)])].sort();
      const slots = times.map((t) => { const b = bs.find((x) => x.time === t); return b ? bookedRow(b) : el('div', { class: 'slot-row free' }, el('span', { class: 'slot-t' }, t), el('span', { class: 'muted' }, 'libre')); });
      const dd = dayDate(iso);
      return el('div', { class: 'wk-day' + (past ? ' past' : '') + (iso === ag.today ? ' today' : '') },
        el('div', { class: 'wk-day-main' },
          el('div', { class: 'wk-day-head' }, el('strong', {}, DIA_LARGO[i]), el('span', { class: 'wk-date' }, dd.getUTCDate() + ' ' + MESES[dd.getUTCMonth()])),
          seg,
          cur !== 'closed' && o ? el('div', { class: 'wk-sede-tag' }, SEDE_NOMBRE[o.sede] || '') : '',
          (cur !== 'closed' && o && !past) ? rangeEditor(iso, o) : ''),
        slots.length ? el('div', { class: 'slot-list' }, ...slots) : el('p', { class: 'muted wk-closed' }, past ? 'Ya pasó' : 'Sin atención'));
    }

    function weekDetail(wk, days, byDay, openMap) {
      const all = days.flatMap((d) => byDay[d] || []);
      const nReq = all.filter((b) => b.status === 'requested').length;
      const wd = dayDate(wk), we = dayDate(addIso(wk, 6));
      const title = 'Semana del ' + wd.getUTCDate() + (wd.getUTCMonth() !== we.getUTCMonth() ? ' ' + MESES[wd.getUTCMonth()] : '') + ' al ' + we.getUTCDate() + ' ' + MESES[we.getUTCMonth()];
      const sedeSelect = select('sede', [['quilpue', 'Quilpué'], ['vina', 'Viña del Mar'], ['quillota', 'Quillota']], sedeSel);
      sedeSelect.addEventListener('change', () => { sedeSel = sedeSelect.value; });
      const bulk = async (mode, label) => {
        const targets = days.filter((iso, i) => iso >= ag.today && (mode === 'closed' || i < 5));
        if (!targets.length) { msg.textContent = 'Esa semana ya pasó.'; return; }
        if (mode === 'closed' && !confirm('¿Cerrar toda la semana? Los días con horas pedidas no se cierran.')) return;
        let bad = 0;
        for (const iso of targets) { if (!(await setMode(iso, mode))) bad++; }
        await refresh();
        if (bad) msg.textContent = bad + (bad === 1 ? ' día no se pudo cambiar' : ' días no se pudieron cambiar') + ' (tienen horas pedidas: respóndelas primero).';
      };
      const openDays = days.filter((iso) => iso >= ag.today && openMap[iso] && openMap[iso].mode !== 'closed');
      const wFrom = el('input', { type: 'time', step: '1800', value: '16:00', 'aria-label': 'Desde' });
      const wTo = el('input', { type: 'time', step: '1800', value: '20:00', 'aria-label': 'Hasta' });
      const wGo = el('button', { class: 'btn ghost small', type: 'button', onclick: async () => {
        if (!openDays.length) { msg.textContent = 'Abre primero algún día de esta semana.'; return; }
        wGo.disabled = true; msg.textContent = '';
        let bad = 0;
        for (const iso of openDays) { if (!(await applyRange(iso, openMap[iso], wFrom.value, wTo.value))) bad++; }
        wGo.disabled = false; await refresh();
        if (bad) msg.textContent = bad + (bad === 1 ? ' día no se pudo cambiar. ' : ' días no se pudieron cambiar. ') + msg.textContent;
      } }, 'Aplicar a días abiertos');
      const head = el('div', { class: 'wk-head' },
        el('div', {}, el('strong', { class: 'wk-title' }, title),
          el('div', { class: 'muted', style: 'font-size:12.5px;margin-top:2px' }, nReq + (nReq === 1 ? ' por confirmar' : ' por confirmar') + ' · ' + (all.length - nReq) + (all.length - nReq === 1 ? ' confirmada' : ' confirmadas'))),
        el('div', { class: 'wk-tools' },
          el('label', { class: 'wk-sede' }, 'Sede al abrir', sedeSelect),
          el('button', { class: 'btn ghost small', type: 'button', onclick: () => bulk('am') }, 'Lun–Vie mañana'),
          el('button', { class: 'btn ghost small', type: 'button', onclick: () => bulk('pm') }, 'Lun–Vie tarde'),
          el('button', { class: 'btn ghost small', type: 'button', onclick: () => bulk('closed') }, 'Cerrar semana')),
        el('div', { class: 'rng-week' }, el('span', { class: 'muted', style: 'font-size:12.5px' }, 'Horario de toda la semana:'), el('label', {}, 'Desde', wFrom), el('label', {}, 'Hasta', wTo), wGo));
      return el('div', { class: 'wk-detail' }, head, el('div', { class: 'wk-days' }, ...days.map((iso, i) => dayCard(iso, i, openMap[iso], byDay[iso] || []))));
    }

    function calendar(byDay, openMap) {
      const [Y, M] = agState.month.split('-').map(Number);
      const shiftMonth = (n) => { agState.month = new Date(Date.UTC(Y, M - 1 + n, 1, 12)).toISOString().slice(0, 7); paint(); };
      const nav = el('div', { class: 'cal-nav' },
        el('button', { class: 'btn ghost small', type: 'button', 'aria-label': 'Mes anterior', onclick: () => shiftMonth(-1) }, '‹'),
        el('strong', { class: 'cal-title' }, MES_FULL[M - 1] + ' ' + Y),
        el('button', { class: 'btn ghost small', type: 'button', 'aria-label': 'Mes siguiente', onclick: () => shiftMonth(1) }, '›'),
        el('button', { class: 'btn ghost small', type: 'button', onclick: () => { agState.month = ag.today.slice(0, 7); agState.week = mondayOf(ag.today); paint(); } }, 'Hoy'));
      const cell = (iso) => {
        const o = openMap[iso], bs = byDay[iso] || [];
        const req = bs.filter((b) => b.status === 'requested').length, conf = bs.length - req;
        const dots = [...Array(Math.min(req, 4)).fill('req'), ...Array(Math.min(conf, 4)).fill('ok')].map((k) => el('i', { class: 'dot ' + k }));
        const isOpen = o && o.mode !== 'closed';
        return el('div', { class: 'cal-day' + (iso.slice(0, 7) === agState.month ? '' : ' off') + (iso === ag.today ? ' today' : '') + (iso < ag.today ? ' past' : '') + (isOpen ? ' open' : '') },
          el('span', { class: 'cal-n' }, String(dayDate(iso).getUTCDate())),
          el('span', { class: 'cal-tag' }, isOpen ? rangeTag(o) : ''),
          el('span', { class: 'cal-dots' }, ...dots));
      };
      const grid = el('div', { class: 'cal' }, el('div', { class: 'cal-dow' }, ...DIA_CORTO.map((l) => el('span', {}, l))));
      const last = new Date(Date.UTC(Y, M, 0, 12)).toISOString().slice(0, 10);
      for (let wk = mondayOf(Y + '-' + String(M).padStart(2, '0') + '-01'); wk <= last; wk = addIso(wk, 7)) {
        const days = Array.from({ length: 7 }, (_, i) => addIso(wk, i));
        const sel = agState.week === wk;
        const toggle = () => { agState.week = sel ? null : wk; paint(); };
        grid.append(el('div', { class: 'cal-week' + (sel ? ' sel' : ''), role: 'button', tabindex: '0', 'aria-expanded': String(sel), 'aria-label': 'Semana del ' + dayLabel(wk), onclick: toggle,
          onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } } }, ...days.map(cell)));
        if (sel) grid.append(weekDetail(wk, days, byDay, openMap));
      }
      return [
        el('h2', {}, 'Agenda'),
        el('p', { class: 'muted', style: 'font-size:13px' }, 'Toca una semana para abrirla: ahí eliges la disponibilidad de cada día y ves las horas que piden las alumnas. Un día con horas pedidas no se puede cambiar hasta responderlas.'),
        nav, grid,
        el('p', { class: 'cal-legend muted' }, el('i', { class: 'dot req' }), ' por confirmar  ', el('i', { class: 'dot ok' }), ' confirmada  · el texto bajo el número es la disponibilidad'),
      ];
    }

    function paint() {
      const byDay = {};
      for (const b of ag.bookings) (byDay[b.day] = byDay[b.day] || []).push(b);
      const openMap = Object.fromEntries(ag.days.map((d) => [d.day, d]));
      const asked = ag.bookings.filter((b) => b.status === 'requested');
      pendingBox.replaceChildren(
        el('h2', {}, 'Horas por confirmar'),
        asked.length
          ? el('div', { class: 'list' }, ...asked.map((b) => el('div', { class: 'card item' },
            el('div', {}, el('strong', {}, b.name), el('br'), el('span', { class: 'muted' }, dayLabel(b.day) + ' · ' + b.time)),
            el('div', { class: 'row' }, bkBtn(b, 'confirm', 'Confirmar'), bkBtn(b, 'reject', 'Rechazar', true)))))
          : el('p', { class: 'muted' }, 'No hay horas por confirmar.'));
      const syncBtn = el('button', { class: 'btn ghost small', type: 'button' }, 'Sincronizar horas confirmadas');
      syncBtn.onclick = () => syncGcal(syncBtn);
      calBox.replaceChildren(
        ag.gcal
          ? el('div', { class: 'row', style: 'align-items:center;gap:10px;margin:6px 0' }, el('span', { class: 'muted' }, '📅 Conectado a Google Calendar: las horas confirmadas aparecen allí solas.'), syncBtn)
          : el('p', { class: 'muted' }, '📅 Google Calendar sin conectar.'),
        ...calendar(byDay, openMap));
    }
    paint();
    return [pendingBox, calBox, msg];
  }

  async function render() {
    const [pend, stu, ag] = await Promise.all([api('/api/admin/pending'), api('/api/admin/students'), api('/api/admin/agenda')]);
    const top = el('div', { class: 'top' },
      el('div', {}, el('span', { class: 'brand' }, 'YOHI COACH · PANEL'), el('p', { class: 'hello' }, 'Hola, ' + me.data.user.name.split(' ')[0])),
      el('button', { class: 'btn ghost small', type: 'button', onclick: logout }, 'Cerrar sesión'));

    const pendingCards = (pend.data.pending || []).map((u) => {
      const det = el('details', {}, el('summary', { class: 'btn small', style: 'list-style:none' }, 'Revisar y aprobar'), el('div', { style: 'margin-top:14px' }, approveForm(u, render)));
      const reject = el('button', { class: 'btn ghost small', type: 'button', onclick: async () => {
        if (!confirm('¿Rechazar la solicitud de ' + u.name + '?')) return;
        await api('/api/admin/reject', { userId: u.id }); render();
      } }, 'Rechazar');
      return el('div', { class: 'card' },
        el('div', { class: 'item' }, el('div', {}, el('strong', {}, u.name), el('br'), el('span', { class: 'muted' }, u.email)),
          el('div', { class: 'row' }, reject)),
        el('div', { style: 'margin-top:14px' }, det));
    });

    function medPanel(st) {
      const box = el('div', { style: 'margin-top:12px' }, el('p', { class: 'muted' }, 'Cargando…'));
      async function load() {

      const form = el('form', { class: 'form', novalidate: '' },
        el('div', { style: 'margin-bottom:10px' }, upBtn, fileIn, upMsg),
        el('label', {}, 'Tipo de rutina', kindSel),
        dateLbl,
        el('label', {}, 'Nombre', nameIn),
        el('h3', { style: 'margin:14px 0 6px;font-size:15px' }, 'Ejercicios'),
        exList, addBtn, draftNote, msg, go);
      form.addEventListener('input', () => setTimeout(saveDraft, 0));
      form.addEventListener('change', () => setTimeout(saveDraft, 0));

      form.addEventListener('submit', async (e) => {
        e.preventDefault(); msg.textContent = ''; go.disabled = true;
        const valid = exercises.filter(x => x.name.trim());
        if (!valid.length) { msg.textContent = 'Agrega al menos un ejercicio con nombre.'; go.disabled = false; return; }
        const r = await api('/api/admin/routine', {
          userId: st.id, weekOf: weekIn.value, daily: kindSel.value === 'day', name: nameIn.value,
          exercises: valid.map(x => ({ name: x.name.trim(), sets: x.sets || 3, reps: x.reps || '8-12', restSec: x.restSec || 90, warmupSets: x.warmupSets ?? 1, day: (x.day || '').trim(), notes: x.notes || '' }))
        });
        go.disabled = false;
        if (!r.ok) { msg.textContent = r.data.error || 'No se pudo guardar.'; return; }
        msg.className = 'ok'; msg.textContent = '✓ Rutina guardada'; clearDraft();
        loadRoutines();
      });

      const routinesList = el('div', { style: 'margin-top:14px' });

      async function loadRoutines() {
        const r = await api('/api/admin/routines?userId=' + st.id);
        if (!r.ok || !r.data.routines.length) { routinesList.replaceChildren(el('p', { class: 'muted' }, 'Sin rutinas.')); return; }
        routinesList.replaceChildren(...r.data.routines.map(rt => {
          const [, m, d] = rt.week_of.split('-').map(Number);
          const detR = el('details', {}, el('summary', { class: 'btn ghost small', style: 'list-style:none;display:inline-flex;font-size:13px' }, 'Ver ejercicios'));
          detR.addEventListener('toggle', async () => {
            if (!detR.open || detR.dataset.loaded) return;
            detR.dataset.loaded = '1';
            const rd = await api('/api/admin/routine?id=' + rt.id);
            if (!rd.ok) return;
            detR.append(routineView(rd.data.exercises));
          });
          const detLog = el('details', {}, el('summary', { class: 'btn ghost small', style: 'list-style:none;display:inline-flex;font-size:13px' }, '📊 Ver registro de la alumna'));
          const loadLog = async (keep) => {
            keep = keep || {};
            const [rd, lg] = await Promise.all([api('/api/admin/routine?id=' + rt.id), api('/api/admin/training-logs?userId=' + st.id + '&weekOf=' + rt.week_of)]);
            const body = el('div', { style: 'margin-top:8px' });
            if (!rd.ok || !lg.ok) body.append(el('p', { class: 'err' }, 'No pude cargar el registro.'));
            else {
              const fmtD = (iso) => { const [, mm, dd] = iso.split('-').map(Number); return dd + ' ' + MESES[mm - 1]; };
              const fmtN = (n) => (n == null ? '–' : String(n));
              let any = false;
              const groups = dayGroups(rd.data.exercises);
              const multi = !(groups.length === 1 && !groups[0].day);
              for (const g of groups) {
                const holder = multi ? el('div') : body;
                let withData = 0;
                for (const ex of g.items) {
                  const exLogs = lg.data.logs.filter((l) => l.exercise_id === ex.id);
                  const exNotes = lg.data.notes.filter((n) => n.exercise_id === ex.id);
                  const dates = [...new Set([...exLogs.map((l) => l.logged_on), ...exNotes.map((n) => n.logged_on)])].sort();
                  const item = el('div', { class: 'reg-ex' }, el('div', { class: 'reg-name' }, ex.name, el('span', { class: 'muted', style: 'font-weight:500;font-size:13px' }, '  ' + ex.sets + '×' + ex.reps)));
                  if (!dates.length) item.append(el('div', { class: 'muted', style: 'font-size:13px' }, 'Sin registro'));
                  else withData++;
                  for (const d of dates) {
                    any = true;
                    const sets = exLogs.filter((l) => l.logged_on === d);
                    const fmtSet = (l) => (l.set_type === 'warmup' ? 'C' : 'S') + l.set_num + ': ' + fmtN(l.kg) + ' kg × ' + fmtN(l.reps) + (l.rir != null ? ' (RIR ' + l.rir + ')' : '');
                    item.append(el('div', { class: 'reg-date' }, fmtD(d)));
                    if (sets.length) item.append(el('div', { class: 'reg-sets' }, sets.map(fmtSet).join('  ·  ')));
                    for (const n of exNotes.filter((x) => x.logged_on === d)) item.append(el('p', { class: 'reg-note' }, '📝 ', n.note));
                  }
                  item.append(regEditor(ex, exLogs, rt, st.id, keep.ex === ex.id, () => {
                    const days = [...detLog.querySelectorAll('details.rv-day')].map((x) => [x, x.querySelector('.rv-day-name').textContent]).filter(([x]) => x.open).map(([, n]) => n);
                    loadLog({ days: days.map((n) => (n === 'Otros ejercicios' ? '' : n)), ex: ex.id });
                  }));
                  holder.append(item);
                }
                if (multi) {
                  const det = el('details', { class: 'rv-day' },
                    el('summary', {}, el('span', { class: 'rv-day-name' }, g.day || 'Otros ejercicios'), el('span', { class: 'rv-day-count' }, withData + '/' + g.items.length + ' con registro')), holder);
                  det.open = keep.days ? keep.days.includes(g.day || '') : withData > 0;
                  body.append(det);
                }
              }
              if (!any) body.prepend(el('p', { class: 'muted', style: 'font-size:13px' }, 'La alumna aún no ha registrado nada esta semana.'));
            }
            const old = detLog.querySelector('.reg-wrap'); if (old) old.remove();
            body.classList.add('reg-wrap'); detLog.append(body);
          };
          detLog.addEventListener('toggle', () => { if (detLog.open) loadLog(); });
          const delBtn = el('button', { class: 'btn ghost small', style: 'font-size:12px', type: 'button', onclick: async () => {
            if (!confirm('¿Borrar rutina de ' + d + '/' + m + '?')) return;
            await api('/api/admin/routine/delete', { id: rt.id }); loadRoutines();
          } }, 'Borrar');
          const editBtn = el('button', { class: 'btn ghost small', style: 'font-size:12px', type: 'button', onclick: async () => {
            kindSel.value = rt.day_on ? 'day' : 'week'; weekIn.value = rt.week_of; syncKind(true); nameIn.value = rt.name || '';
            const rd = await api('/api/admin/routine?id=' + rt.id);
            if (rd.ok) {
              exercises = rd.data.exercises.map(ex => ({ name: ex.name, sets: ex.sets, reps: ex.reps, restSec: ex.rest_sec, warmupSets: ex.warmup_sets, day: ex.day || '', notes: ex.notes || '' }));
              renderForm();
            }
          } }, 'Editar');
          return el('div', { style: 'padding:8px 0;border-bottom:1px solid rgba(255,214,232,.1)' },
            el('div', { class: 'row', style: 'align-items:center;gap:8px;flex-wrap:wrap' },
              el('strong', { style: 'font-size:14px' }, (rt.day_on ? 'Diaria · ' : 'Semana · ') + d + ' ' + MESES[m - 1] + (rt.name ? ' · ' + rt.name : '')),
              editBtn, delBtn),
            detR, detLog);
        }));
      }

      async function load() {
        if (!restoreDraft()) renderForm();
        draftReady = true;
        await loadRoutines();
        box.replaceChildren(form, routinesList);
      }
      return { box, load };
    }

    // ---------- navegación por pestañas ----------
    const students = stu.data.students || [];
    const pendingList = pend.data.pending || [];
    const asked = ag.ok ? ag.data.bookings.filter((b) => b.status === 'requested').length : 0;
    const parts = location.hash.slice(1).split('/');
    const tab = ['alumnos', 'mensajes', 'planes', 'agenda'].includes(parts[0]) ? parts[0] : (parts[0] === 'alumno' ? 'alumnos' : 'alumnos');
    const ICONS = {
      alumnos: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.5c2 .7 3.5 2.6 3.5 5.5"/>',
      mensajes: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
      planes: '<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/>',
      agenda: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    };
    const tabsNav = el('nav', { class: 'tabs', 'aria-label': 'Secciones del panel' }, ...[['alumnos', 'Alumnos', pendingList.length], ['mensajes', 'Mensajes', 0], ['planes', 'Planes', 0], ['agenda', 'Agenda', asked]].map(([id, label, n]) => {
      const a = el('a', { href: '#' + id, class: id === tab ? 'on' : '' });
      a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[id] + '</svg>';
      a.append(label);
      if (n) a.append(' ', el('span', { class: 'nbadge' }, String(n)));
      if (id === tab) a.setAttribute('aria-current', 'page');
      return a;
    }));
    const initials = (n) => n.trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    const rel = (iso) => { if (!iso) return 'Sin registros todavía'; const d = Math.round((dayDate(today) - dayDate(iso)) / 86400000); return 'Registró ' + (d <= 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días'); };
    const planChip = (s) => !s.modality ? el('span', { class: 'chip mute' }, 'Sin plan')
      : s.modality === 'presencial' ? el('span', { class: 'chip' }, 'Presencial 1:1 · ' + (s.used ?? 0) + '/' + s.sessions_total)
      : el('span', { class: 'chip mute' }, 'Online' + (daysLeft(s.end_date) <= 7 ? ' · vence en ' + daysLeft(s.end_date) + (daysLeft(s.end_date) === 1 ? ' día' : ' días') : ''));

    // --- Alumnos: cuentas por aprobar + lista ---
    function alumnosView() {
      let q = '', filt = 'todas';
      const listBox = el('div', { class: 'card', style: 'padding:6px 18px' });
      const FILTERS = [['todas', 'Todas'], ['presencial', 'Presencial'], ['online', 'Online'], ['vence', 'Por vencer']];
      const segBox = el('div', { class: 'seg', role: 'group', 'aria-label': 'Filtrar alumnas' });
      const match = (s) => {
        if (q && !(plain(s.name) + ' ' + plain(s.email)).includes(plain(q))) return false;
        if (filt === 'presencial') return s.modality === 'presencial';
        if (filt === 'online') return s.modality === 'online';
        if (filt === 'vence') return !!s.end_date && daysLeft(s.end_date) <= 7;
        return true;
      };
      function paintList() {
        segBox.replaceChildren(...FILTERS.map(([k, t]) => el('button', { type: 'button', 'aria-pressed': String(filt === k), onclick: () => { filt = k; paintList(); } }, t + (k === 'todas' ? ' · ' + students.length : ''))));
        const shown = students.filter(match);
        listBox.replaceChildren(shown.length
          ? el('div', { class: 'list stu-list' }, ...shown.map((s) => el('a', { class: 'stu', href: '#alumno/' + s.id },
            el('span', { class: 'avatar' }, initials(s.name)),
            el('div', { class: 'stu-main' }, el('strong', {}, s.name), el('span', { class: 'muted' }, rel(s.last_log))),
            planChip(s), el('span', { class: 'stu-go', 'aria-hidden': 'true' }, '›'))))
          : el('p', { class: 'muted', style: 'margin:14px 0' }, students.length ? 'Ninguna alumna coincide con la búsqueda.' : 'Aún no hay alumnos activos.'));
      }
      const search = el('input', { type: 'search', placeholder: 'Buscar alumna por nombre o correo…', 'aria-label': 'Buscar alumna', oninput: (e) => { q = e.target.value; paintList(); } });
      paintList();
      return [
        ...(pendingList.length ? [el('h2', { style: 'margin-top:0' }, 'Cuentas por aprobar'), el('div', { class: 'list' }, ...pendingCards)] : []),
        el('h2', { style: pendingList.length ? '' : 'margin-top:0' }, 'Alumnas'),
        el('div', { class: 'row', style: 'gap:10px' }, el('div', { style: 'flex:1;min-width:220px' }, search), segBox),
        listBox,
      ];
    }

    // --- Ficha de una alumna: Rutina / Progreso ---
    function fichaView(st, sub) {
      const delBox = el('div', { class: 'card', hidden: '', style: 'border-color:rgba(255,107,107,.5);display:grid;gap:10px' });
      const confirmIn = el('input', { type: 'text', placeholder: 'ELIMINAR', 'aria-label': 'Escribe ELIMINAR para confirmar', autocomplete: 'off' });
      const delMsg = el('p', { class: 'err', role: 'alert' });
      const delGo = el('button', { class: 'btn small danger', type: 'button', disabled: '' }, 'Eliminar para siempre');
      confirmIn.addEventListener('input', () => { delGo.disabled = confirmIn.value.trim().toUpperCase() !== 'ELIMINAR'; });
      delGo.onclick = async () => {
        delGo.disabled = true; delMsg.textContent = '';
        const r = await api('/api/admin/student/delete', { userId: st.id });
        if (!r.ok) { delMsg.textContent = r.data.error || 'No se pudo eliminar.'; delGo.disabled = false; return; }
        try { localStorage.removeItem('yc-rt-draft:' + st.id); } catch {}
        location.hash = '#alumnos';
      };
      delBox.append(el('strong', {}, 'Eliminar la cuenta de ' + st.name),
        el('p', { class: 'muted', style: 'margin:0;font-size:13.5px' }, 'Se borran para siempre su plan, sus horas, sus rutinas, sus registros de entrenamiento y sus mediciones. Las horas confirmadas también salen de Google Calendar. No se puede deshacer.'),
        el('label', {}, 'Para confirmar, escribe ELIMINAR', confirmIn), delMsg,
        el('div', { class: 'row' }, delGo, el('button', { class: 'btn ghost small', type: 'button', onclick: () => { delBox.hidden = true; confirmIn.value = ''; delGo.disabled = true; } }, 'Cancelar')));
      const planTxt = st.modality ? (st.modality === 'presencial' ? 'Presencial 1:1 · ' + (SEDE_NOMBRE[st.sede] || '') + ' · ' + (st.used ?? 0) + ' de ' + st.sessions_total + ' sesiones' : 'Asesoría online') + ' · vence ' + fmtDate(st.end_date) : 'Sin plan';
      const head = el('div', { class: 'card ficha-head' },
        el('span', { class: 'avatar big-av' }, initials(st.name)),
        el('div', { style: 'flex:1;min-width:200px' }, el('h1', { style: 'margin:0' }, st.name), el('p', { class: 'muted', style: 'margin:4px 0 0;font-size:13.5px' }, st.email + ' · ' + planTxt)),
        el('a', { class: 'btn ghost small', href: '#planes/' + st.id }, 'Editar plan'),
        el('button', { class: 'btn ghost small danger', type: 'button', onclick: () => { delBox.hidden = false; confirmIn.focus(); } }, 'Eliminar cuenta'));
      const segs = el('div', { class: 'seg', role: 'group', 'aria-label': 'Secciones de la ficha' },
        ...[['rutina', 'Rutina'], ['progreso', 'Progreso']].map(([k, t]) => el('button', { type: 'button', 'aria-pressed': String(sub === k), onclick: () => { location.hash = '#alumno/' + st.id + (k === 'progreso' ? '/progreso' : ''); } }, t)));
      let body;
      if (sub === 'progreso') {
        const mp = medPanel(st);
        body = el('section', { class: 'card' }, el('h2', { style: 'margin-top:0' }, 'Medidas'), mp.box);
        mp.load();
      } else {
        const rp = routinePanel(st);
        body = el('section', { class: 'card' }, el('h2', { style: 'margin-top:0' }, 'Rutina de ' + st.name.split(' ')[0]), rp.box);
        rp.load();
      }
      return [el('a', { class: 'back', href: '#alumnos' }, '‹ Alumnos'), head, delBox, segs, body];
    }

    // --- Planes ---
    function planesView(editId) {
      let filt = 'todos';
      const dl = (s) => (s.end_date ? daysLeft(s.end_date) : null);
      const expired = (s) => !!s.end_date && s.end_date < today;
      const FILTERS = [['todos', 'Todos'], ['vigentes', 'Vigentes'], ['vence', 'Por vencer'], ['vencidos', 'Vencidos']];
      const match = (s) => filt === 'vigentes' ? !!s.end_date && !expired(s) && dl(s) > 7 : filt === 'vence' ? !!s.end_date && !expired(s) && dl(s) <= 7 : filt === 'vencidos' ? !s.end_date || expired(s) : true;
      const tbl = el('div', { class: 'card' });
      const segBox = el('div', { class: 'seg', role: 'group', 'aria-label': 'Filtrar planes' });
      function paint() {
        segBox.replaceChildren(...FILTERS.map(([k, t]) => el('button', { type: 'button', 'aria-pressed': String(filt === k), onclick: () => { filt = k; paint(); } }, t)));
        const shown = students.filter(match);
        tbl.replaceChildren(shown.length ? el('div', { class: 'list' }, ...shown.map((s) => el('div', { class: 'plan-row' + (s.id === editId ? ' sel' : '') },
          el('span', { class: 'avatar' }, initials(s.name)),
          el('div', { class: 'stu-main' }, el('strong', {}, s.name),
            el('span', { class: 'muted' }, s.modality ? (s.modality === 'presencial' ? 'Presencial 1:1 · ' + (SEDE_NOMBRE[s.sede] || '') : 'Online') + ' · ' + fmtDate(s.start_date) + ' al ' + fmtDate(s.end_date) : 'Sin plan')),
          s.modality === 'presencial' ? el('span', { class: 'chip' }, (s.used ?? 0) + ' / ' + s.sessions_total) : '',
          s.end_date && !expired(s) && dl(s) <= 7 ? el('span', { class: 'chip gold' }, 'Vence en ' + dl(s) + (dl(s) === 1 ? ' día' : ' días')) : (expired(s) ? el('span', { class: 'chip mute' }, 'Vencido') : ''),
          el('a', { class: 'btn ghost small', href: '#planes/' + s.id }, 'Editar plan'))))
          : el('p', { class: 'muted', style: 'margin:0' }, 'No hay planes en esta vista.'));
      }
      paint();
      const st = editId ? students.find((x) => x.id === editId) : null;
      return [
        el('h2', { style: 'margin-top:0' }, 'Planes de las alumnas'),
        ...(st ? [el('div', { class: 'card', style: 'border-color:rgba(255,109,180,.45)' },
          el('div', { class: 'row', style: 'justify-content:space-between' }, el('h2', { style: 'margin:0' }, 'Editar plan · ' + st.name),
            el('div', { class: 'row' }, el('a', { class: 'btn ghost small', href: '#alumno/' + st.id }, 'Volver a la ficha'), el('a', { class: 'btn ghost small', href: '#planes' }, 'Cerrar'))),
          planPanel(st))] : []),
        segBox, tbl,
      ];
    }

    const mensajesView = () => [el('h2', { style: 'margin-top:0' }, 'Mensajes'),
      el('section', { class: 'card', style: 'display:grid;gap:10px' },
        el('p', { style: 'margin:0' }, 'Aquí van a llegar los mensajes de tus alumnas, con aviso cuando el asistente derive una duda de dolor, lesión o alimentación.'),
        el('p', { class: 'muted', style: 'margin:0;font-size:13.5px' }, 'Todavía no está activo. Mientras tanto, las alumnas pueden escribirte por WhatsApp desde su portal.'))];

    let content;
    if (tab === 'agenda') content = ag.ok ? agendaSection(ag.data) : [el('p', { class: 'err' }, 'No se pudo cargar la agenda.')];
    else if (tab === 'mensajes') content = mensajesView();
    else if (tab === 'planes') content = planesView(parts[0] === 'planes' && parts[1] ? Number(parts[1]) : null);
    else {
      const st = parts[0] === 'alumno' ? students.find((x) => x.id === Number(parts[1])) : null;
      content = st ? fichaView(st, parts[2] === 'progreso' ? 'progreso' : 'rutina') : alumnosView();
    }
    app.replaceChildren(top, tabsNav, el('div', { class: 'admview' }, ...content));
  }
  const plain = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>
