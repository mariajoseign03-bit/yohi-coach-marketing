<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de Yohi · Yohi Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<main class="wrap" id="app" aria-live="polite">
  <p class="muted">Cargando…</p>
</main>
<script src="/metricas.js"></script>
<script src="/portal.js"></script>
<script src="/informe.js"></script>
<script src="/bodypro.js"></script>
<script src="/rutina-lector.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const me = await api('/api/me');
  if (me.status === 401) { location.replace('/'); return; }
  if (!me.ok || me.data.user.role !== 'admin') { location.replace('/alumnos'); return; }

  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

  function select(name, opts, value) {
    const s = el('select', { name }, opts.map(([v, t]) => el('option', { value: v }, t)));
    if (value) s.value = value;
    return s;
  }

  function approveForm(u, reload) {
    const msg = el('p', { class: 'err', role: 'alert' });
    const modality = select('modality', [['presencial', 'Presencial 1:1'], ['online', 'Asesoría online']], 'presencial');
    const sede = select('sede', [['quilpue', 'Quilpué'], ['vina', 'Viña del Mar'], ['quillota', 'Quillota']], 'quilpue');
    const sessions = el('input', { name: 'sessions', type: 'number', min: '1', max: '40', value: '12', inputmode: 'numeric' });
    const months = select('months', [['1', '1 mes'], ['3', '3 meses']], '1');
    const start = el('input', { name: 'start', type: 'date', value: today });
    const wPres = el('div', { class: 'form' }, el('label', {}, 'Sede', sede), el('label', {}, 'Sesiones del plan', sessions));
    const wOn = el('div', { class: 'form', hidden: '' }, el('label', {}, 'Duración', months));
    modality.addEventListener('change', () => { const p = modality.value === 'presencial'; wPres.hidden = !p; wOn.hidden = p; });
    const go = el('button', { class: 'btn', type: 'submit' }, 'Aprobar y asignar plan');
    const form = el('form', { class: 'form', novalidate: '' },
      el('label', {}, 'Modalidad', modality), wPres, wOn, el('label', {}, 'Inicio del plan', start), msg, go);
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); msg.textContent = ''; go.disabled = true;
      const body = { userId: u.id, modality: modality.value, start: start.value };
      if (modality.value === 'presencial') { body.sede = sede.value; body.sessions = Number(sessions.value); }
      else body.months = Number(months.value);
      const r = await api('/api/admin/approve', body);
      go.disabled = false;
      if (!r.ok) { msg.textContent = r.data.error || 'No se pudo aprobar.'; return; }
      reload();
    });
    return form;
  }

  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const dayDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); };
  const dayLabel = (iso) => { const dt = dayDate(iso); return DIAS[dt.getUTCDay()] + ' ' + dt.getUTCDate() + ' ' + MESES[dt.getUTCMonth()]; };
  const addIso = (iso, n) => new Date(dayDate(iso).getTime() + n * 86400000).toISOString().slice(0, 10);
  let sedeSel = 'quilpue';

  function agendaSection(ag, reload) {
    const msg = el('p', { class: 'err', role: 'alert' });
    const act = (id, action, label, ghost) => el('button', { class: 'btn small' + (ghost ? ' ghost' : ''), type: 'button', onclick: async () => {
      if (action !== 'confirm' && !confirm('¿' + label + ' esta hora? La sesión vuelve al plan de la alumna.')) return;
      const r = await api('/api/admin/booking', { id, action });
      if (!r.ok) { msg.textContent = r.data.error || 'No se pudo.'; return; }
      reload();
    } }, label);
    const asked = ag.bookings.filter((b) => b.status === 'requested');
    const conf = ag.bookings.filter((b) => b.status === 'confirmed');
    const row = (b, btns) => el('div', { class: 'card item' }, el('div', {}, el('strong', {}, b.name), el('br'), el('span', { class: 'muted' }, dayLabel(b.day) + ' · ' + b.time)), el('div', { class: 'row' }, ...btns));
    const openMap = Object.fromEntries(ag.days.map((d) => [d.day, d.mode]));
    const modes = (iso) => (dayDate(iso).getUTCDay() % 6 === 0 ? [['closed', 'Cerrado'], ['wk', '9:00–13:00']] : [['closed', 'Cerrado'], ['am', 'Mañana 8:30'], ['pm', 'Tarde 16:00']]);
    const rows = [];
    for (let i = 0; i < 14; i++) {
      const iso = addIso(ag.today, i);
      const cur = openMap[iso] || 'closed';
      const seg = el('div', { class: 'seg' }, modes(iso).map(([m, t]) => {
        const b = el('button', { type: 'button', 'aria-pressed': String(cur === m), onclick: async () => {
          msg.textContent = '';
          const r = await api('/api/admin/open-day', { day: iso, mode: m, sede: sedeSel });
          if (!r.ok) { msg.textContent = r.data.error || 'No se pudo.'; return; }
          reload();
        } }, t);
        return b;
      }));
      rows.push(el('div', { class: 'card item' }, el('strong', {}, dayLabel(iso)), seg));
    }
    const sedeSelect = select('sede', [['quilpue', 'Quilpué'], ['vina', 'Viña del Mar'], ['quillota', 'Quillota']], sedeSel);
    sedeSelect.addEventListener('change', () => { sedeSel = sedeSelect.value; });
    return [
      el('h2', {}, 'Horas por confirmar'),
      asked.length ? el('div', { class: 'list' }, ...asked.map((b) => row(b, [act(b.id, 'confirm', 'Confirmar'), act(b.id, 'reject', 'Rechazar', true)]))) : el('p', { class: 'muted' }, 'No hay horas por confirmar.'),
      el('h2', {}, 'Horas confirmadas'),
      conf.length ? el('div', { class: 'list' }, ...conf.map((b) => row(b, [act(b.id, 'cancel', 'Cancelar', true)]))) : el('p', { class: 'muted' }, 'Aún no hay horas confirmadas.'),
      el('h2', {}, 'Abrir agenda (próximos 14 días)'),
      el('p', { class: 'muted', style: 'font-size:13px' }, 'Elige por día mañana o tarde. Los fines de semana son de 9:00 a 13:00. Un día con horas pedidas no se puede cambiar hasta responderlas.'),
      el('label', { style: 'max-width:260px;margin-bottom:12px' }, 'Sede de los días que abras', sedeSelect),
      msg,
      el('div', { class: 'list' }, ...rows)];
  }

  async function render() {
    const [pend, stu, ag] = await Promise.all([api('/api/admin/pending'), api('/api/admin/students'), api('/api/admin/agenda')]);
    const top = el('div', { class: 'top' },
      el('div', {}, el('span', { class: 'brand' }, 'YOHI COACH · PANEL'), el('p', { class: 'hello' }, 'Hola, ' + me.data.user.name.split(' ')[0])),
      el('button', { class: 'btn ghost small', type: 'button', onclick: logout }, 'Cerrar sesión'));

    const pendingCards = (pend.data.pending || []).map((u) => {
      const det = el('details', {}, el('summary', { class: 'btn small', style: 'list-style:none' }, 'Revisar y aprobar'), el('div', { style: 'margin-top:14px' }, approveForm(u, render)));
      const reject = el('button', { class: 'btn ghost small', type: 'button', onclick: async () => {
        if (!confirm('¿Rechazar la solicitud de ' + u.name + '?')) return;
        await api('/api/admin/reject', { userId: u.id }); render();
      } }, 'Rechazar');
      return el('div', { class: 'card' },
        el('div', { class: 'item' }, el('div', {}, el('strong', {}, u.name), el('br'), el('span', { class: 'muted' }, u.email)),
          el('div', { class: 'row' }, reject)),
        el('div', { style: 'margin-top:14px' }, det));
    });

    function medPanel(st) {
      const box = el('div', { style: 'margin-top:12px' }, el('p', { class: 'muted' }, 'Cargando…'));
      async function load() {
        const r = await api('/api/admin/measurements?userId=' + st.id);
        if (!r.ok) { box.replaceChildren(el('p', { class: 'err' }, r.data.error || 'No se pudo cargar.')); return; }
        if (!r.data.enabled) { box.replaceChildren(el('p', { class: 'muted' }, 'Esta alumna no ha autorizado el registro de mediciones (datos de salud). No se pueden cargar.')); return; }
        const msg = el('p', { class: 'err', role: 'alert' });
        const inp = (name, ph, step) => el('input', { name, type: 'number', step, inputmode: 'decimal', placeholder: ph, 'aria-label': ph });
        const date = el('input', { name: 'date', type: 'date', value: today, max: today, 'aria-label': 'Fecha' });
        const fw = inp('weight_kg', 'Peso (kg)', '0.1'), ff = inp('fat_pct', 'Grasa (%)', '0.1'), fm = inp('muscle_kg', 'Músculo (kg)', '0.1');
        const go = el('button', { class: 'btn small', type: 'submit' }, 'Guardar medición');
        const pdf = el('input', { name: 'pdf', type: 'file', accept: 'image/*,application/pdf,.pdf', 'aria-label': 'Imagen del informe de Body Pro Go' });
        const xin = {};
        const extraFields = METRICAS.list.filter((d) => d.src === 'extra').map((d) => {
          xin[d.key] = el('input', { type: 'number', step: d.dec === 2 ? '0.01' : d.dec === 1 ? '0.1' : '1', inputmode: 'decimal', min: String(d.min), max: String(d.max), 'aria-label': d.label });
          return el('label', { style: 'font-size:12.5px' }, d.label + (d.unit ? ' (' + d.unit + ')' : ''), xin[d.key]);
        });
        const more = el('details', { class: 'more' }, el('summary', {}, 'Más datos del informe (se llenan solos con la imagen)'),
          el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px' }, ...extraFields));
        let extra = null;
        const read = el('p', { class: 'muted', style: 'font-size:13px;margin:0' });
        pdf.addEventListener('change', async () => {
          extra = null; read.textContent = ''; msg.textContent = '';
          const file = pdf.files && pdf.files[0];
          if (!file) return;
          read.textContent = BodyPro.isImage(file) ? 'Leyendo la imagen… (la primera vez tarda unos segundos)' : 'Leyendo el informe…';
          try {
            const r = await BodyPro.read(file);
            if (r.date && r.date <= today) date.value = r.date;
            if (r.core.weight_kg !== undefined) fw.value = r.core.weight_kg;
            if (r.core.fat_pct !== undefined) ff.value = r.core.fat_pct;
            if (r.core.muscle_kg !== undefined) fm.value = r.core.muscle_kg;
            extra = r.extra;
            for (const [k, i] of Object.entries(xin)) i.value = typeof r.extra[k] === 'number' ? r.extra[k] : '';
            const n = Object.keys(r.extra).filter((k) => k !== 'ranges').length;
            if (n) more.open = true;
            read.textContent = '✦ Leí ' + r.found + ' datos del informe. Revísalos con la imagen antes de guardar: la lectura automática puede equivocarse.';
          } catch (e) { read.textContent = e.message + ' Puedes escribir los valores a mano; el archivo igual se guarda.'; }
        });
        const form = el('form', { class: 'form', novalidate: '' }, el('label', {}, 'Imagen del informe Body Pro Go (o PDF). Si la subes, leo los valores sola.', pdf), read,
          el('label', {}, 'Fecha del control', date),
          el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px' }, el('label', { style: 'font-size:12.5px' }, 'Peso (kg)', fw), el('label', { style: 'font-size:12.5px' }, 'Grasa (%)', ff), el('label', { style: 'font-size:12.5px' }, 'Masa muscular (kg)', fm)), more, msg, go);
        form.addEventListener('submit', async (e) => {
          e.preventDefault(); msg.textContent = ''; go.disabled = true;
          let file = pdf.files && pdf.files[0];
          if (file && BodyPro.isImage(file)) { try { file = await BodyPro.cleanJpeg(file); } catch (err) { msg.textContent = 'No pude preparar la imagen. Prueba con otra captura.'; go.disabled = false; return; } }
          if (file && file.size > 4 * 1024 * 1024) { msg.textContent = 'El archivo pesa más de 4 MB.'; go.disabled = false; return; }
          const ex = {};
          for (const [k, i] of Object.entries(xin)) if (i.value !== '') ex[k] = Number(i.value);
          if (extra && extra.ranges) ex.ranges = extra.ranges;
          extra = Object.keys(ex).length ? ex : null;
          const fd = new FormData();
          fd.set('userId', String(st.id)); fd.set('date', date.value); fd.set('weight_kg', fw.value); fd.set('fat_pct', ff.value); fd.set('muscle_kg', fm.value);
          if (file) fd.set('pdf', file);
          if (extra) fd.set('extra', JSON.stringify(extra));
          go.textContent = file ? 'Subiendo…' : 'Guardando…';
          const x = await apiForm('/api/admin/measurement', fd); go.disabled = false; go.textContent = 'Guardar medición';
          if (!x.ok) { msg.textContent = x.data.error || 'No se pudo guardar.'; return; }
          load();
        });
        const list = r.data.items.map((i) => el('div', { class: 'item', style: 'padding:8px 0;border-bottom:1px solid rgba(255,214,232,.1)' },
          el('span', { style: 'font-size:14px' }, fmtDate(i.measured_on) + ' · ' + ([i.weight_kg !== null ? i.weight_kg + ' kg' : null, i.fat_pct !== null ? i.fat_pct + ' % grasa' : null, i.muscle_kg !== null ? i.muscle_kg + ' kg músculo' : null].filter(Boolean).join(' · ') || 'Solo informe')),
          el('span', { class: 'row' }, i.has_pdf ? el('a', { class: 'btn ghost small', href: '/api/measurements/pdf?id=' + i.id, target: '_blank', rel: 'noopener' }, 'Ver informe') : '',
          el('button', { class: 'btn ghost small', type: 'button', onclick: async () => { if (!confirm('¿Borrar esta medición?')) return; await api('/api/admin/measurement/delete', { id: i.id }); load(); } }, 'Borrar'))));
        const asc = [...r.data.items].reverse().filter((i) => i.weight_kg !== null || i.fat_pct !== null || i.muscle_kg !== null || (i.extra && Object.keys(i.extra).length));
        const rep = asc.length ? el('button', { class: 'btn small', type: 'button', style: 'margin-top:12px', onclick: () => YohiReport.print({ name: st.name, cur: asc[asc.length - 1], prev: asc.length > 1 ? asc[asc.length - 2] : null }) }, 'Informe con logo (PDF)') : '';
        box.replaceChildren(form, rep, el('div', { style: 'margin-top:14px' }, ...(list.length ? list : [el('p', { class: 'muted' }, 'Aún no hay mediciones.')])));
      }
      return { box, load };
    }
    function planPanel(st) {
      const msg = el('p', { class: 'err', role: 'alert' });
      const modality = select('modality', [['presencial', 'Presencial 1:1'], ['online', 'Asesoría online']], st.modality || 'presencial');
      const sede = select('sede', [['quilpue', 'Quilpué'], ['vina', 'Viña del Mar'], ['quillota', 'Quillota']], st.sede || 'quilpue');
      const sessions = el('input', { name: 'sessions', type: 'number', min: '1', max: '40', inputmode: 'numeric', value: String(st.sessions_total || 12) });
      const months = select('months', [['1', '1 mes'], ['3', '3 meses']], '1');
      const start = el('input', { name: 'start', type: 'date', value: st.start_date || today });
      const end = el('input', { name: 'end', type: 'date', value: st.end_date || '' });
      const renew = el('input', { type: 'checkbox', name: 'renew', style: 'width:auto;min-height:0' });
      const wPres = el('div', { class: 'form' }, el('label', {}, 'Sede', sede), el('label', {}, 'Sesiones del plan', sessions));
      const wOn = el('div', { class: 'form' }, el('label', {}, 'Duración (si cambias las fechas)', months));
      const sync = () => { const p = modality.value === 'presencial'; wPres.hidden = !p; wOn.hidden = p; };
      modality.addEventListener('change', sync); sync();
      const go = el('button', { class: 'btn small', type: 'submit' }, 'Guardar cambios');
      renew.addEventListener('change', () => { go.textContent = renew.checked ? 'Renovar con un plan nuevo' : 'Guardar cambios'; });
      const form = el('form', { class: 'form', novalidate: '', style: 'margin-top:12px' },
        el('label', {}, 'Modalidad', modality), wPres, wOn,
        el('label', {}, 'Inicio del plan', start), el('label', {}, 'Término del plan (puedes extenderlo)', end),
        el('label', { style: 'display:flex;gap:10px;align-items:center;font-weight:600' }, renew, 'Renovar: crear un plan nuevo (las sesiones vuelven a empezar)'),
        el('p', { class: 'muted', style: 'font-size:12.5px;margin:0' }, 'Sin marcar "renovar", corriges el plan actual y se conservan las horas ya usadas.'), msg, go);
      form.addEventListener('submit', async (e) => {
        e.preventDefault(); msg.textContent = ''; go.disabled = true;
        const body = { userId: st.id, modality: modality.value, start: start.value, renew: renew.checked };
        if (end.value) body.end = end.value;
        if (modality.value === 'presencial') { body.sede = sede.value; body.sessions = Number(sessions.value); } else body.months = Number(months.value);
        let r = await api('/api/admin/plan', body);
        if (r.status === 409 && confirm(r.data.error + ' ¿Continuar?')) r = await api('/api/admin/plan', { ...body, cancelBookings: true });
        go.disabled = false;
        if (!r.ok) { if (r.status !== 409) msg.textContent = r.data.error || 'No se pudo guardar.'; return; }
        render();
      });
      return form;
    }
    function routinePanel(st) {
      const box = el('div', { style: 'margin-top:12px' }, el('p', { class: 'muted' }, 'Cargando…'));
      let exercises = [{ name: '', sets: 3, reps: '8-12', restSec: 90, warmupSets: 1, notes: '' }];
      const weekIn = el('input', { name: 'week_of', type: 'date', value: (() => { const d = new Date(); const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); return new Date(d.setDate(diff)).toISOString().slice(0, 10); })() });
      const nameIn = el('input', { name: 'name', type: 'text', placeholder: 'Nombre de la rutina (opcional)' });

      function exRow(ex, idx) {
        const rm = el('button', { type: 'button', class: 'btn ghost small', style: 'padding:4px 8px', onclick: () => { exercises.splice(idx, 1); renderForm(); } }, '✕');
        const nameI = el('input', { type: 'text', placeholder: 'Ej: Press banca', value: ex.name, oninput: (e) => { ex.name = e.target.value; } });
        const setsI = el('input', { type: 'number', min: '1', max: '20', value: ex.sets, style: 'width:60px', oninput: (e) => { ex.sets = Number(e.target.value); } });
        const repsI = el('input', { type: 'text', placeholder: '8-12', value: ex.reps, style: 'width:70px', oninput: (e) => { ex.reps = e.target.value; } });
        const restI = el('input', { type: 'number', min: '0', max: '600', value: ex.restSec, style: 'width:70px', oninput: (e) => { ex.restSec = Number(e.target.value); } });
        const warmI = el('input', { type: 'number', min: '0', max: '5', value: ex.warmupSets, style: 'width:60px', oninput: (e) => { ex.warmupSets = Number(e.target.value); } });
        const noteI = el('input', { type: 'text', placeholder: 'Nota para la alumna', value: ex.notes, oninput: (e) => { ex.notes = e.target.value; } });
        return el('div', { class: 'routine-ex' },
          el('div', { class: 'routine-ex-head' },
            el('span', { class: 'routine-ex-num' }, String(idx + 1)),
            el('div', { style: 'flex:1' }, nameI), rm),
          el('div', { class: 'routine-ex-fields' },
            el('label', { style: 'font-size:12px' }, 'Series', setsI),
            el('label', { style: 'font-size:12px' }, 'Reps', repsI),
            el('label', { style: 'font-size:12px' }, 'Desc (s)', restI),
            el('label', { style: 'font-size:12px' }, 'Calent.', warmI)),
          el('div', { style: 'margin-top:6px' }, noteI));
      }

      const exList = el('div');
      const msg = el('p', { class: 'err', role: 'alert' });
      const go = el('button', { class: 'btn small', type: 'submit' }, 'Guardar rutina');
      const addBtn = el('button', { type: 'button', class: 'btn ghost small', style: 'margin-top:8px', onclick: () => { exercises.push({ name: '', sets: 3, reps: '8-12', restSec: 90, warmupSets: 1, notes: '' }); renderForm(); } }, '+ Ejercicio');

      function renderForm() { exList.replaceChildren(...exercises.map(exRow)); }

      const upMsg = el('p', { class: 'muted', role: 'status', style: 'font-size:13px;margin:6px 0 0' });
      const fileIn = el('input', { type: 'file', accept: '.pdf,.xlsx,.csv,.txt,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', style: 'display:none' });
      const upBtn = el('button', { type: 'button', class: 'btn small', onclick: () => fileIn.click() }, '📄 Subir rutina (PDF o Excel)');
      fileIn.addEventListener('change', async () => {
        const f = fileIn.files && fileIn.files[0]; if (!f) return;
        upBtn.disabled = true; upMsg.className = 'muted'; upMsg.textContent = 'Leyendo ' + f.name + '…';
        try {
          const r = await RoutineReader.read(f);
          if (!r.exercises.length) { upMsg.className = 'err'; upMsg.textContent = 'No pude encontrar ejercicios en ese archivo. Revisa que tenga ejercicio, series y repeticiones, o escríbelos abajo.'; }
          else {
            exercises = r.exercises; if (!nameIn.value) nameIn.value = f.name.replace(/\.[^.]+$/, '').slice(0, 60);
            renderForm(); upMsg.className = 'ok';
            upMsg.textContent = 'Leí ' + r.exercises.length + (r.exercises.length === 1 ? ' ejercicio' : ' ejercicios') + '. Revisa los datos' + (r.missingRest ? ' (en ' + r.missingRest + ' no encontré el descanso y puse 90 s)' : '') + ', elige la semana y toca Guardar rutina.';
          }
        } catch (e) { upMsg.className = 'err'; upMsg.textContent = e.message || 'No pude leer ese archivo.'; }
        upBtn.disabled = false; fileIn.value = '';
      });

      const form = el('form', { class: 'form', novalidate: '' },
        el('div', { style: 'margin-bottom:10px' }, upBtn, fileIn, upMsg),
        el('label', {}, 'Semana (lunes)', weekIn),
        el('label', {}, 'Nombre', nameIn),
        el('h3', { style: 'margin:14px 0 6px;font-size:15px' }, 'Ejercicios'),
        exList, addBtn, msg, go);

      form.addEventListener('submit', async (e) => {
        e.preventDefault(); msg.textContent = ''; go.disabled = true;
        const valid = exercises.filter(x => x.name.trim());
        if (!valid.length) { msg.textContent = 'Agrega al menos un ejercicio con nombre.'; go.disabled = false; return; }
        const r = await api('/api/admin/routine', {
          userId: st.id, weekOf: weekIn.value, name: nameIn.value,
          exercises: valid.map(x => ({ name: x.name.trim(), sets: x.sets || 3, reps: x.reps || '8-12', restSec: x.restSec || 90, warmupSets: x.warmupSets || 1, notes: x.notes || '' }))
        });
        go.disabled = false;
        if (!r.ok) { msg.textContent = r.data.error || 'No se pudo guardar.'; return; }
        msg.className = 'ok'; msg.textContent = '✓ Rutina guardada';
        loadRoutines();
      });

      const routinesList = el('div', { style: 'margin-top:14px' });

      async function loadRoutines() {
        const r = await api('/api/admin/routines?userId=' + st.id);
        if (!r.ok || !r.data.routines.length) { routinesList.replaceChildren(el('p', { class: 'muted' }, 'Sin rutinas.')); return; }
        routinesList.replaceChildren(...r.data.routines.map(rt => {
          const [, m, d] = rt.week_of.split('-').map(Number);
          const detR = el('details', {}, el('summary', { class: 'btn ghost small', style: 'list-style:none;display:inline-flex;font-size:13px' }, 'Ver ejercicios'));
          detR.addEventListener('toggle', async () => {
            if (!detR.open || detR.dataset.loaded) return;
            detR.dataset.loaded = '1';
            const rd = await api('/api/admin/routine?id=' + rt.id);
            if (!rd.ok) return;
            detR.append(...rd.data.exercises.map((ex, i) =>
              el('div', { class: 'routine-log-row' },
                el('span', { style: 'font-weight:700;font-size:13px' }, (i + 1) + '. ' + ex.name),
                el('span', { class: 'muted', style: 'font-size:12px' }, ex.sets + '×' + ex.reps + ' · ' + ex.rest_sec + 's desc' + (ex.warmup_sets ? ' · ' + ex.warmup_sets + ' calent.' : '')))));
          });
          const delBtn = el('button', { class: 'btn ghost small', style: 'font-size:12px', type: 'button', onclick: async () => {
            if (!confirm('¿Borrar rutina de ' + d + '/' + m + '?')) return;
            await api('/api/admin/routine/delete', { id: rt.id }); loadRoutines();
          } }, 'Borrar');
          const editBtn = el('button', { class: 'btn ghost small', style: 'font-size:12px', type: 'button', onclick: async () => {
            weekIn.value = rt.week_of; nameIn.value = rt.name || '';
            const rd = await api('/api/admin/routine?id=' + rt.id);
            if (rd.ok) {
              exercises = rd.data.exercises.map(ex => ({ name: ex.name, sets: ex.sets, reps: ex.reps, restSec: ex.rest_sec, warmupSets: ex.warmup_sets, notes: ex.notes || '' }));
              renderForm();
            }
          } }, 'Editar');
          return el('div', { style: 'padding:8px 0;border-bottom:1px solid rgba(255,214,232,.1)' },
            el('div', { class: 'row', style: 'align-items:center;gap:8px;flex-wrap:wrap' },
              el('strong', { style: 'font-size:14px' }, d + ' ' + MESES[m - 1] + (rt.name ? ' · ' + rt.name : '')),
              editBtn, delBtn),
            detR);
        }));
      }

      async function load() {
        renderForm();
        await loadRoutines();
        box.replaceChildren(form, routinesList);
      }
      return { box, load };
    }

    const rows = (stu.data.students || []).map((s) => {
      const mp = medPanel(s);
      const det = el('details', { style: 'width:100%' }, el('summary', { class: 'btn ghost small', style: 'list-style:none;display:inline-flex' }, 'Mediciones'), mp.box);
      det.addEventListener('toggle', () => { if (det.open) mp.load(); });
      const planDet = el('details', { style: 'width:100%' }, el('summary', { class: 'btn ghost small', style: 'list-style:none;display:inline-flex' }, 'Editar plan'), planPanel(s));
      const rp = routinePanel(s);
      const routineDet = el('details', { style: 'width:100%' }, el('summary', { class: 'btn ghost small', style: 'list-style:none;display:inline-flex' }, '🏋️ Rutinas'), rp.box);
      routineDet.addEventListener('toggle', () => { if (routineDet.open) rp.load(); });
      return el('div', { class: 'card' },
        el('div', { class: 'item' },
          el('div', {}, el('strong', {}, s.name), el('br'), el('span', { class: 'muted' }, s.email)),
          el('div', { class: 'muted', style: 'font-size:13px' }, s.modality
            ? [s.modality === 'presencial' ? `1:1 · ${SEDE_NOMBRE[s.sede] || ''} · ${s.sessions_total} sesiones` : 'Online', ' · vence ', fmtDate(s.end_date)]
            : 'Sin plan')),
        el('div', { class: 'row', style: 'margin-top:12px;align-items:flex-start;flex-wrap:wrap' }, planDet, routineDet, det));
    });

    app.replaceChildren(top,
      ...(ag.ok ? agendaSection(ag.data, render) : []),
      el('h2', {}, 'Cuentas por aprobar'),
      pendingCards.length ? el('div', { class: 'list' }, ...pendingCards) : el('p', { class: 'muted' }, 'No hay cuentas pendientes.'),
      el('h2', {}, 'Alumnos activos'),
      rows.length ? el('div', { class: 'list' }, ...rows) : el('p', { class: 'muted' }, 'Aún no hay alumnos activos.'));
  }
  render();
})();
</script>
</body>
</html>
